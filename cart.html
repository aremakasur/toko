<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keranjang | Arema Kasur</title><link rel="stylesheet" href="product-detail.html"><style>body{margin:0;font:15px Arial;color:#0f172a;background:linear-gradient(135deg,#e0f2fe,#f0f9ff,#ecfeff)}.wrap{max-width:900px;margin:auto;padding:30px 20px}.box{background:#ffffffc9;border:1px solid #d9edf5;border-radius:24px;padding:24px;box-shadow:0 18px 45px #0c4a6e14}.logo{font:800 22px Arial;color:#0f172a;text-decoration:none}.logo span{color:#0ea5e9}header{padding:20px;border-bottom:1px solid #d9edf5;background:#ffffffc9}h1{font-size:38px}.item{display:flex;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid #d9edf5}.art{width:80px;height:80px;border-radius:16px;background:#dff9ff;display:grid;place-items:center;font-size:40px}.info{flex:1}.muted{color:#557389;font-size:13px}.price{font-weight:800;color:#075985}.summary{margin-top:20px;border-top:1px solid #d9edf5;padding-top:18px}.row{display:flex;justify-content:space-between;margin:10px 0;color:#557389}.row strong{color:#075985}.btn{display:inline-flex;padding:13px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.empty{text-align:center;padding:35px;color:#557389}</style></head><body><header><div class="wrap"><a class="logo" href="text.html">AREMA <span>KASUR</span></a></div></header><main class="wrap"><div class="box"><h1>Keranjang Belanja</h1><div id="cart"></div><div class="summary"><div class="row"><span>Subtotal</span><strong id="total">Rp 0</strong></div><div class="row"><span>Ongkir Malang Raya</span><strong>Gratis</strong></div><a class="btn" href="checkout.html">Lanjut ke Checkout</a></div></div></main><script>const cart=JSON.parse(localStorage.getItem('aremaCart')||'null'),el=document.getElementById('cart');if(!cart){el.innerHTML='<div class="empty">Keranjang masih kosong.<br><br><a class="btn" href="text.html#produk">Lihat Katalog</a></div>'}else{el.innerHTML=`<div class="item"><div class="art">🛏️</div><div class="info"><b>${cart.name}</b><div class="muted">${cart.size} · Medium Firm · ${cart.qty} unit</div></div><div class="price">Rp ${(cart.price*cart.qty).toLocaleString('id-ID')}</div></div>`;document.getElementById('total').textContent='Rp '+(cart.price*cart.qty).toLocaleString('id-ID')}</script></body></html>
