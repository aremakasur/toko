<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Arema Kasur</title><style>body{margin:0;font:15px Arial;color:#0f172a;background:linear-gradient(135deg,#e0f2fe,#f0f9ff,#ecfeff)}.wrap{max-width:980px;margin:auto;padding:30px 20px}.logo{font:800 22px Arial;color:#0f172a;text-decoration:none}.logo span{color:#0ea5e9}header{padding:20px;border-bottom:1px solid #d9edf5;background:#ffffffc9}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;margin-top:20px}.box{background:#ffffffc9;border:1px solid #d9edf5;border-radius:24px;padding:24px;box-shadow:0 18px 45px #0c4a6e14}h1{font-size:36px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;color:#075985;font-weight:700;font-size:13px}.full{grid-column:1/-1}input,textarea,select{width:100%;padding:12px;border:1px solid #d9edf5;border-radius:10px;background:#fff;box-sizing:border-box}textarea{min-height:90px}.summary{height:max-content}.row{display:flex;justify-content:space-between;margin:12px 0;color:#557389}.row strong{color:#075985}.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:white;font-weight:800;cursor:pointer;margin-top:18px}@media(max-width:700px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><div class="wrap"><a class="logo" href="text.html">AREMA <span>KASUR</span></a></div></header><main class="wrap"><div class="layout"><section class="box"><h1>Checkout</h1><form id="form"><div class="fields"><label>Nama lengkap<input required name="name" placeholder="Nama Anda"></label><label>No. WhatsApp<input required name="phone" placeholder="08xx-xxxx-xxxx"></label><label class="full">Alamat lengkap<textarea required name="address" placeholder="Alamat pengiriman"></textarea></label><label>Kota<select name="city"><option>Malang</option><option>Batu</option><option>Kabupaten Malang</option></select></label><label>Metode pembayaran<select name="payment"><option>Transfer Bank</option><option>COD</option><option>E-Wallet</option></select></label></div><button class="btn">Buat Pesanan</button></form></section><aside class="box summary"><h2>Ringkasan</h2><div id="summary"></div><div class="row"><span>Total</span><strong id="total">Rp 0</strong></div></aside></div></main><script>const cart=JSON.parse(localStorage.getItem('aremaCart')||'null');if(cart){document.getElementById('summary').innerHTML=`<p><b>${cart.name}</b><br><small>${cart.size} · ${cart.qty} unit</small></p>`;document.getElementById('total').textContent='Rp '+(cart.price*cart.qty).toLocaleString('id-ID')}document.getElementById('form').onsubmit=e=>{e.preventDefault();localStorage.setItem('aremaOrder',JSON.stringify({id:'AK-'+Date.now().toString().slice(-6),...Object.fromEntries(new FormData(e.target)),cart}));location.href='success.html'}</script></body></html>
