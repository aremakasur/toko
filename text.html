<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arema Kasur - Pusat Kasur Busa & Springbed Malang</title>
  <style>
    :root {
      --bg-primary: #f0f9ff;
      --bg-card: rgba(255, 255, 255, 0.85);
      --accent-cyan: #00f0ff;
      --accent-blue: #0066ff;
      --text-dark: #0f172a;
      --border-cyan: rgba(0, 240, 255, 0.4);
      --shadow-glow: 0 10px 30px rgba(0, 200, 255, 0.15);
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #e6fffa 100%);
      color: var(--text-dark);
    }

    /* Glassmorphism Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-cyan);
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(0, 102, 255, 0.3);
    }

    /* Hero Section */
    .hero {
      padding: 60px 5%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .hero-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-cyan);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow-glow);
    }

    .hero-title {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #0052cc, #00d2d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0066ff, #00d2d3);
      color: #fff;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 102, 255, 0.3);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AREMA <span>KASUR</span></div>
    <button class="btn-primary">Hubungi CS WhatsApp</button>
  </header>

  <section class="hero">
    <div class="hero-card">
      <h1 class="hero-title">Inovasi Tidur Masa Depan dengan Busa Kualitas Premium</h1>
      <p>Rasakan kenyamanan tidur maksimal dengan teknologi busa tahan kempes garansi hingga 20 tahun. Pengiriman gratis khusus area Malang Raya.</p>
      <button class="btn-primary">Lihat Katalog Produk</button>
    </div>
  </section>

</body>
</html>
