<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesanan Berhasil | Arema Kasur</title><style>body{margin:0;font:15px Arial;color:#0f172a;background:linear-gradient(135deg,#e0f2fe,#f0f9ff,#ecfeff);text-align:center}.box{max-width:580px;margin:12vh auto;padding:38px 24px;background:#ffffffd4;border:1px solid #d9edf5;border-radius:26px;box-shadow:0 18px 45px #0c4a6e14}.check{width:80px;height:80px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#16a34a;font-size:44px}h1{font:800 42px Arial;letter-spacing:-.05em}p{color:#557389;line-height:1.7}.detail{margin:22px auto;padding:16px;text-align:left;border:1px solid #d9edf5;border-radius:16px;background:#ffffff99}.row{display:flex;justify-content:space-between;margin:9px 0;color:#557389}.row strong{color:#075985}.btn{display:inline-block;padding:14px 20px;border-radius:12px;background:linear-gradient(135deg,#06b6d4,#0ea5e9);color:#fff;text-decoration:none;font-weight:800}</style></head><body><main class="box"><div class="check">✓</div><h1>Pesanan Berhasil</h1><p>Terima kasih. Tim Arema Kasur akan menghubungi Anda melalui WhatsApp untuk konfirmasi pesanan dan pengiriman.</p><div class="detail" id="detail"></div><a class="btn" href="text.html">Kembali ke Beranda</a></main><script>const o=JSON.parse(localStorage.getItem('aremaOrder')||'null');document.getElementById('detail').innerHTML=o?`<div class="row"><span>No. Pesanan</span><strong>${o.id}</strong></div><div class="row"><span>Nama</span><strong>${o.name}</strong></div><div class="row"><span>Produk</span><strong>${o.cart?.name||'Pesanan Arema Kasur'}</strong></div>`:'Pesanan Anda telah diterima.';localStorage.removeItem('aremaCart')</script></body></html>
